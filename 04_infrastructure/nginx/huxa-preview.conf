# Preview environments: https://dev-<topic>.huxa.is serves the worktree at
# /opt/huxa-dev/<topic>, built by 05_scripts/preview.sh into
# /var/lib/huxa-preview/<topic>/www, with its own backend on a unix socket.
# The config is static: bringing a preview up or down needs no nginx reload.
# Needs a proxied wildcard DNS record *.huxa.is and an origin cert that
# covers *.huxa.is. The limit_req zone is defined in huxa.conf.

server {
    listen 80;
    server_name ~^dev-[a-z0-9-]+\.huxa\.is$;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ~^dev-(?<topic>[a-z0-9-]+)\.huxa\.is$;

    ssl_certificate /etc/ssl/cloudflare/huxa.pem;
    ssl_certificate_key /etc/ssl/cloudflare/huxa.key;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex" always;

    root /var/lib/huxa-preview/$topic/www;
    index index.html;

    location / {
        limit_req zone=huxa burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(events|diary|categories|query|transcribe|reports|attachments|health)(/|$) {
        limit_req zone=huxa burst=20 nodelay;
        client_max_body_size 25m;
        proxy_pass http://unix:/var/lib/huxa-preview/$topic/backend.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\. {
        deny all;
    }
}

# Any other name under *.huxa.is: drop the connection instead of serving production
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/ssl/cloudflare/huxa.pem;
    ssl_certificate_key /etc/ssl/cloudflare/huxa.key;
    return 444;
}
